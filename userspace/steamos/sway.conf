#!/bin/sh
# Display host configuration for the SM-T870 panel.
#
# The panel needs two VIG planes in one atomic commit; only the patched
# wlroots in this project implements that.  Sway is therefore the KMS owner and
# every SteamOS session runs nested inside it.

output DSI-1 transform 90

xwayland disable
default_border none
default_floating_border none
hide_edge_borders both
focus_follows_mouse no
mouse_warping none

# No bar, no background: the only client is the nested Steam session.
exec_always /usr/local/lib/tabs7linux/steamos/start-app.sh
