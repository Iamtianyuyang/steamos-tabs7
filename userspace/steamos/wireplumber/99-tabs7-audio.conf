# WirePlumber adjustments for the SM-T870 speakers. This image carries the
# Steam Frame audio config (deckard-audio-config), written for the Frame's
# own LPASS card and microphones.

# Two Frame components do not fit the Tab:
#  - microphone-tracker.lua calls Json.Raw(defaults:find(0,
#    "default.audio.source")) unguarded; without any capture device that is
#    nil and WirePlumber segfaults in wp_spa_json_new_from_string() as soon as
#    a real ALSA sink changes the defaults;
#  - spatial-node-config.lua inserts the headset spatialiser, whose
#    vraudiocompositor.so is not in the image.
# Bluetooth codecs: with the QCA6390 firmware here A2DP negotiates AAC happily
# but the headset stays silent (the transport is up, pw-play succeeds, nothing
# is audible), while SBC plays. Pin SBC; remove this block if a future firmware
# or headset makes AAC work.
monitor.bluez.properties = {
  bluez5.codecs = [ sbc ]
}

# Bluetooth audio: WirePlumber 0.5 only creates its bluez5 monitor when the
# logind seat reports "active", and this session has no seat at all (the Game
# Mode session is a plain "background" one, which is also why the suspend rule
# had to exist). Without the monitor no A2DP endpoint is registered, BlueZ then
# has no profile to offer and every connect fails with "Protocol not
# available". Turning seat monitoring off makes the monitor unconditional.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
    "steamos.microphone-tracker" = "disabled"
    "steamos.spatial-node-config" = "disabled"
  }
}

# The speaker sink:
#  - 10-access.conf hides a node named exactly
#    "alsa_output.platform-sound.HiFi__Speaker__sink" from ordinary clients
#    (on the Frame that is the raw speaker behind the spatialiser). Ours gets
#    the same generated name, so it was hidden and every link to it failed
#    with EPERM. Give it its own name.
#  - 50-alsa-config.conf gives every platform card a 256-frame period; the
#    SM-T870 MultiMedia1 front end accepts 480..16320 frames.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.*"
        api.alsa.card.longname = "SM-T870"
      }
    ]
    actions = {
      update-props = {
        node.name = "alsa_output.sm-t870.speaker"
        api.alsa.period-size = 1024
      }
    }
  }
]
