# Use case configuration for the Samsung Galaxy Tab S7 (SM-T870) speakers.
# MultiMedia1 (PCM 0) is routed to PRIMARY_TDM_RX_0; the four CS35L41
# amplifiers take TDM slot 0 (left pair) or 1 (right pair).

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	# The speaker-protection DSP firmware is not running yet, so the PCM goes
	# straight from the serial port to the DAC. Cap the amplifier digital
	# volume at -6 dB (step 0.125 dB, 817 = 0 dB) until it is; the analog gain
	# stays at its 0.5 dB reset value. PipeWire's own volume does the rest.
	EnableSequence [
		cset "name='Front Left PCM Source' ASP"
		cset "name='Front Right PCM Source' ASP"
		cset "name='Rear Left PCM Source' ASP"
		cset "name='Rear Right PCM Source' ASP"
		cset "name='Front Left Digital PCM Volume' 769"
		cset "name='Front Right Digital PCM Volume' 769"
		cset "name='Rear Left Digital PCM Volume' 769"
		cset "name='Rear Right Digital PCM Volume' 769"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
